name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storefront
    env:
      # Codegen reads the committed Saleor schema instead of a live API.
      GITHUB_ACTION: generate-schema-from-file
      NEXT_PUBLIC_SALEOR_API_URL: https://api.irongrip.uk/graphql/
      NEXT_PUBLIC_DEFAULT_CHANNEL: uk
      STOREFRONT_CHANNELS: uk
      NEXT_PUBLIC_STOREFRONT_LOCALES: en
      CONTENT_PROVIDER: code
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: storefront/.nvmrc
          cache: pnpm
          cache-dependency-path: storefront/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:all
      - run: pnpm run lint:design-tokens
      - run: pnpm exec tsc --noEmit
      - run: pnpm run lint
      - run: pnpm run test:run
      - run: pnpm audit --prod --audit-level=high
        continue-on-error: true
